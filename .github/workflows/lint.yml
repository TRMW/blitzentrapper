# Runs bin/lint (RuboCop with Rails' omakase config, plus ESLint for the
# React code) on every PR and push to master. This replaces Hound's review;
# see .hound.yml.
name: Lint

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same Ruby as the Gemfile so bin/lint can `bundle exec rubocop`. If they
      # ever differ, bin/lint falls back to installing the RuboCop gems locked
      # in Gemfile.lock.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.13"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: bin/lint
