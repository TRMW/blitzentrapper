# Rails' default RuboCop config (what `rails new` generates since Rails 7.2):
# https://github.com/rails/rubocop-rails-omakase
# Run it with bin/lint, which also runs ESLint.
inherit_gem:
  rubocop-rails-omakase: rubocop.yml

AllCops:
  TargetRubyVersion: 3.3
  TargetRailsVersion: 7.1
  Exclude:
    - 'db/schema.rb'
    - 'node_modules/**/*'
    - 'tmp/**/*'
    - 'vendor/**/*'
